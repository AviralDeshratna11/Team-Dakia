# Hard case 10: a different field on the same engine. There's no leather pack: an agent drafts one.
# (Built on the handbook's supply-chain sample request.)
text: >
  We need 300 full-grain leather laptop sleeves, 15-inch, black, with our logo debossed.
  Find three leather-goods manufacturers in Uttar Pradesh, check each is real and active,
  and send each a request for quote. Deliver to Bengaluru within 6 weeks.
