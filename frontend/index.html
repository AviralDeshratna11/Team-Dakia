<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Sourcing Desk: an auditable procurement agent. Describe what you need; it finds, verifies and shortlists suppliers."/>
<meta name="theme-color" content="#176a4c"/>
<title>Sourcing Desk</title>
<!-- Critical CSS for the first paint: the home page renders before any JS or the main stylesheet arrives. -->
<style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22352e;background:#f4f7f6;font-size:16px}
body{margin:0}
#shell .home{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#shell .home-inner{width:100%;max-width:720px;display:grid;gap:18px}
#shell h1{text-align:center;margin:8px 0 4px;font-size:34px;line-height:1.2;letter-spacing:-1.1px;font-weight:650}
#shell .home-brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:18px;justify-self:center}
#shell .brand-icon{background:#136b4e;border-radius:10px;padding:7px;color:#fff;display:grid;place-items:center}
#shell .prompt{position:relative;background:#fff;border:1px solid #d5e0da;border-radius:14px;box-shadow:0 6px 24px rgba(20,60,45,.07);padding:6px;margin:0}
#shell textarea{display:block;width:100%;border:0;margin:0;resize:none;padding:12px 56px 12px 14px;font:inherit;font-size:15px;line-height:1.6;color:#354d3f;background:#fff;outline:none}
#shell .send{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:10px;border:0;background:#176a4c;color:#fff;display:grid;place-items:center;opacity:.5}
#shell .examples{display:grid;gap:8px}
#shell .examples button{font:inherit;text-align:left;border:1px solid #e1e8e4;background:#fff;border-radius:10px;padding:10px 14px;font-size:13px;color:#4f6659;line-height:1.5;cursor:pointer}
#shell .center{margin:7px 0;color:#7f8e83;font-size:12px;line-height:1.6;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
@media(max-width:760px){#shell h1{font-size:28px}}
</style>
</head>
<body>
<div id="shell" aria-hidden="false"><div class="home"><div class="home-inner">
  <div class="home-brand"><span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg></span>Sourcing Desk</div>
  <h1>What do you need to source?</h1>
  <form class="prompt" onsubmit="return false"><textarea id="shell-text" aria-label="Message" rows="4" autofocus placeholder="What do you need to source? Include specs, quantities and where it should go."></textarea><button class="send" type="button" aria-label="Send" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></form>
  <div class="examples"><button type="button">Find three leather-goods manufacturers in Uttar Pradesh, check each is real and active, and draft the first email to each.</button><button type="button">Source ESP32-S3 modules, a 3.3V 500mA SOT-23 LDO regulator, 10uF 0805 capacitors and USB-C connectors. 500 of each, delivered to Bengaluru within three weeks.</button></div>
  <p class="center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg> Payments are simulated and RFQs stay drafts. Nothing is sent to suppliers.</p>
</div></div></div>
<script>
// Before the app loads, example buttons still fill the prompt.
document.querySelectorAll('#shell .examples button').forEach(function (b) { b.onclick = function () { var t = document.getElementById('shell-text'); t.value = b.textContent; t.focus(); }; });
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
