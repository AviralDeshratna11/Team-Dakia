rfq:
  max_vendors: 3
  questions:
  - What grade of full-grain leather do you use? Can you provide samples of the leather?
  - What finishing options are available for the leather (e.g., matte, glossy, distressed)?
  - Can you produce laptop sleeves for 15-inch laptops? Do you offer custom sizing?
  - What are your capabilities for debossing logos? Can you provide examples of previous
