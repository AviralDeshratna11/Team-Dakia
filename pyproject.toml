[project]
name = "desk"
version = "0.1.0"
description = "Sourcing Desk: a BOM goes in, cited and paid orders come out"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "google-genai>=3.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
